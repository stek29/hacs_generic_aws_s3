name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily so a newly published stable Home Assistant release is tested
    # without any repository commit.
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: ruff check
        run: uvx ruff@0.16.6 check .
      - name: ruff format --check
        run: uvx ruff@0.16.6 format --check .

  resolve-latest:
    name: Resolve latest stable HA
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(
            curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/home-assistant/core/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])'
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::latest stable Home Assistant = ${version}"

  test:
    name: HA ${{ matrix.ha }}
    needs: resolve-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha:
          - "2026.8.0" # documented minimum
          - "${{ needs.resolve-latest.outputs.version }}" # latest stable, resolved above
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Provision HA ${{ matrix.ha }} lane
        run: python3 scripts/ci_provision.py "${{ matrix.ha }}" .venv
      - name: Import smoke test (fresh process)
        run: |
          .venv/bin/python -c "from custom_components.generic_s3 import config_flow"
          .venv/bin/python -c "from custom_components.generic_s3.backup import S3BackupAgent"
      - name: Pytest
        run: .venv/bin/python -m pytest

  live:
    name: Live S3 (HA ${{ matrix.ha }})
    needs: resolve-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha:
          - "2026.8.0" # documented minimum
          - "${{ needs.resolve-latest.outputs.version }}" # latest stable, resolved above
    env:
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Start VersityGW
        run: |
          docker volume create gs3vgw
          docker run -d --name versitygw -p 7070:7070 \
            -e ROOT_ACCESS_KEY_ID=testkey \
            -e ROOT_SECRET_ACCESS_KEY=testsecret \
            -v gs3vgw:/data \
            versity/versitygw:v1.8.0 posix /data
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/ || true)"
            [ "$code" != "000" ] && { echo "VersityGW up (HTTP $code)"; break; }
            sleep 1
          done
          aws --endpoint-url http://127.0.0.1:7070 s3 mb s3://ha-live-test
      - name: Provision HA ${{ matrix.ha }} lane
        run: python3 scripts/ci_provision.py "${{ matrix.ha }}" .venv
      - name: Live lifecycle test
        env:
          GENERIC_S3_LIVE_ENDPOINT: http://127.0.0.1:7070
          GENERIC_S3_LIVE_BUCKET: ha-live-test
          GENERIC_S3_LIVE_ACCESS_KEY: testkey
          GENERIC_S3_LIVE_SECRET_KEY: testsecret
          GENERIC_S3_LIVE_ADDRESSING_STYLE: path
        run: .venv/bin/python -m pytest -m live tests/test_live_backup.py
      - name: VersityGW logs
        if: always()
        run: docker logs versitygw || true
