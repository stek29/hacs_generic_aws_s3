name: HACS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily so upstream HACS validator changes are caught without a commit.
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
